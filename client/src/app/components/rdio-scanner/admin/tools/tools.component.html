<mat-accordion displayMode="flat">
    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                <mat-icon>settings_input_antenna</mat-icon>
                SDRangel Setup
            </mat-panel-title>
        </mat-expansion-panel-header>
        <rdio-scanner-admin-sdrangel-setup></rdio-scanner-admin-sdrangel-setup>
    </mat-expansion-panel>
    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                <mat-icon>add_circle</mat-icon>
                Quick-Add Channels
            </mat-panel-title>
        </mat-expansion-panel-header>
        <rdio-scanner-admin-quick-add (config)="config.emit($event)"></rdio-scanner-admin-quick-add>
    </mat-expansion-panel>
    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                <mat-icon>cloud_download</mat-icon>
                RadioReference Import
            </mat-panel-title>
        </mat-expansion-panel-header>
        <rdio-scanner-admin-radioreference (config)="config.emit($event)"></rdio-scanner-admin-radioreference>
    </mat-expansion-panel>
    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                <mat-icon>description</mat-icon>
                Import Talkgroups
            </mat-panel-title>
        </mat-expansion-panel-header>
        <rdio-scanner-admin-import-talkgroups (config)="config.emit($event)"></rdio-scanner-admin-import-talkgroups>
    </mat-expansion-panel>
    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                <mat-icon>description</mat-icon>
                Import Units
            </mat-panel-title>
        </mat-expansion-panel-header>
        <rdio-scanner-admin-import-units (config)="config.emit($event)"></rdio-scanner-admin-import-units>
    </mat-expansion-panel>
    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                <mat-icon>password</mat-icon>
                Admin password
            </mat-panel-title>
        </mat-expansion-panel-header>
        <rdio-scanner-admin-password></rdio-scanner-admin-password>
    </mat-expansion-panel>
    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                <mat-icon>sync_alt</mat-icon>
                Import/export config
            </mat-panel-title>
        </mat-expansion-panel-header>
        <rdio-scanner-admin-import-export-config (config)="config.emit($event)"></rdio-scanner-admin-import-export-config>
    </mat-expansion-panel>
</mat-accordion>
